version: '3.8'

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vendorhub-mssql
    environment:
      SA_PASSWORD: "${MSSQL_SA_PASSWORD:-YourStrong!Pass123}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - vendorhub-net
    restart: always

  redis:
    image: redis:alpine
    container_name: vendorhub-redis
    ports:
      - "6379:6379"
    networks:
      - vendorhub-net
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vendorhub-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__sqlServerCs: "Server=mssql,1433;Database=VendorHubDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrong!Pass123};TrustServerCertificate=true;Encrypt=false;"
      ConnectionStrings__RedisConnection: "redis:6379"
      JWT__SecritKey: "${JWT_SECRET_KEY:-VendorHubSuperSecretKeyForJWTAuth2026!}"
      JWT__IssuerIP: "${JWT_ISSUER:-https://localhost:7081}"
      JWT__AudienceIP: "${JWT_AUDIENCE:-https://localhost:7081}"
      Serilog__WriteTo__1__Args__serverUrl: "http://seq:5341"
    ports:
      - "7081:8080"
    depends_on:
      - mssql
      - redis
      - seq
    networks:
      - vendorhub-net
    restart: always

  seq:
    image: datalust/seq:latest
    container_name: vendorhub-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:5341"
      - "8081:80"
    networks:
      - vendorhub-net
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: vendorhub-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - vendorhub-net
    restart: always

volumes:
  sqldata:
    driver: local

networks:
  vendorhub-net:
    driver: bridge
